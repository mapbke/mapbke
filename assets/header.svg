<svg
    width="1000"
    height="220"
    viewBox="0 0 1000 220"
    xmlns="http://www.w3.org/2000/svg"
>
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0d1117"/>
            <stop offset="55%" stop-color="#111018"/>
            <stop offset="100%" stop-color="#191126"/>
