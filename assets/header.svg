    />

    <circle
        cx="850"
        cy="45"
        r="190"
        fill="url(#glow)"
    />

    <g opacity="0.09" stroke="#c9d1d9">
        <path d="M0 40H1000"/>
        <path d="M0 80H1000"/>
        <path d="M0 120H1000"/>
        <path d="M0 160H1000"/>
        <path d="M0 200H1000"/>

        <path d="M80 0V220"/>
        <path d="M160 0V220"/>
        <path d="M240 0V220"/>
        <path d="M320 0V220"/>
        <path d="M400 0V220"/>
        <path d="M480 0V220"/>
        <path d="M560 0V220"/>
        <path d="M640 0V220"/>
        <path d="M720 0V220"/>
        <path d="M800 0V220"/>
        <path d="M880 0V220"/>
        <path d="M960 0V220"/>
